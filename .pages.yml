# Pages CMS 配置（https://app.pagescms.org）
# 在网页上登录 GitHub、选中这个仓库，就能像用后台一样写文章。
# 保存 = 提交一次 commit，GitHub Actions 会自动重新构建。

media:
  input: source/img
  output: /img

content:
  - name: posts
    label: 文章
    type: collection
    path: source/_posts
    filename: "{fields.title}.md"
    view:
      fields: [title, date, categories]
      sort: [date, desc]
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 发布日期
        type: date
        required: true
        options:
          time: true
      - name: updated
        label: 更新日期
        type: date
        options:
          time: true
      - name: categories
        label: 分类
        type: string
        list: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: cover
        label: 封面
        type: image
      - name: top
        label: 置顶
        type: boolean
        default: false
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
