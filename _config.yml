 # Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: Liu_CuSO4的blog
subtitle: '绝对不是蓝铜'
description: '硫酸铜的个人博客，记录技术笔记与生活碎片。'
keywords: 个人博客,技术笔记
author: 硫酸铜
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## GitHub Pages 用户站：https://<用户名>.github.io
url: https://liucuso4.github.io
permalink: :title/
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 6
  order_by: -date

# Category & Tag
default_category: 随笔
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'date'

# Pagination
per_page: 6
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: butterfly

# Deployment（用 GitHub Actions 自动构建，这里留空）
deploy:
  type: ''
